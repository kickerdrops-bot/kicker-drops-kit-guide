<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#131313">
    <title>体験キットガイドの移転先 | KICKER DROPS</title>
    <link rel="icon" type="image/png" href="./logo.png">
    <style>
      body { margin: 0; color: #171717; background: #fff; font-family: system-ui, sans-serif; }
      main { max-width: 32rem; margin: 12vh auto; padding: 1.5rem; }
      h1 { font-size: clamp(1.5rem, 5vw, 2rem); line-height: 1.45; }
      p { line-height: 1.8; }
      a { display: inline-block; padding: .85rem 1.25rem; background: #c9ff16; color: #121212; border-radius: .5rem; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>体験キットガイドが移転しました</h1>
      <p>自動で切り替わらない場合は、こちらからガイドを開いてください。</p>
      <a id="guide" href="https://www.kickerdrops.com/kit-guide">体験キットガイドを開く</a>
    </main>
    <script>
      const guideLink = document.getElementById("guide");
      const chapters = ["home", "tools", "preparation", "masking", "brush", "splatter", "coating", "shop"];
      const chapter = location.hash.slice(1);
      if (chapters.includes(chapter)) guideLink.hash = chapter;
      location.replace(guideLink.href);
    </script>
  </body>
</html>
